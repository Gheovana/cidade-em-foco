<h1 class="titulo-pagina">Nova Ocorrência</h1>
<p class="subtitulo-pagina">Descreva o problema e adicione uma foto.</p>

<form class="cartao formulario" (ngSubmit)="enviar()">
  <label for="foto">Foto do problema</label>
  <label class="area-foto" for="foto">
    @if (fotoPrevia()) {
      <img [src]="fotoPrevia()" alt="Prévia da foto" />
    } @else {
      <span>📷 Clique para adicionar uma foto</span>
      <small>JPG, PNG ou WEBP, até 5 MB</small>
    }
  </label>
  <input
    id="foto"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    (change)="aoEscolherFoto($event)"
    hidden
  />

  <label for="tipo">Tipo de problema</label>
  <select id="tipo" name="tipo" [(ngModel)]="tipo">
    <option value="" disabled>Selecione um tipo</option>
    @for (t of tipos; track t.valor) {
      <option [value]="t.valor">{{ t.nome }}</option>
    }
  </select>

  <label for="descricao">Descrição (opcional)</label>
  <textarea
    id="descricao"
    name="descricao"
    rows="4"
    maxlength="2000"
    placeholder="Conte mais detalhes sobre o problema..."
    [(ngModel)]="descricao"
  ></textarea>

  <label for="regiao">Localização (bairro ou endereço)</label>
  <input
    id="regiao"
    name="regiao"
    type="text"
    maxlength="100"
    placeholder="Ex.: Centro, Rua das Flores"
    [(ngModel)]="regiao"
  />

  <button class="botao botao-contorno" type="button" (click)="usarLocalizacaoAtual()">
    📍 Usar minha localização atual
  </button>

  @if (latitude() !== null) {
    <p class="coordenadas">
      Coordenadas: {{ latitude()!.toFixed(5) }}, {{ longitude()!.toFixed(5) }}
    </p>
  }

  @if (mensagem()) {
    <p class="aviso" [class.erro]="erro()">{{ mensagem() }}</p>
  }

  <button class="botao enviar" type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Enviando...' : 'Enviar solicitação' }}
  </button>
</form>
