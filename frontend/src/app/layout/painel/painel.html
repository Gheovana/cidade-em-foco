<div class="estrutura">
  <aside class="menu">
    <div class="logo">
      <img class="logo-imagem" src="logo.svg" alt="" />
      <div class="logo-texto">Cidade<br />em Foco</div>
    </div>

    <p class="usuario-nome">{{ auth.usuario()?.nome }}</p>

    <nav class="links">
      <a routerLink="/inicio" routerLinkActive="ativo">🏠 Início</a>
      <a routerLink="/minhas-solicitacoes" routerLinkActive="ativo">
        📋 {{ auth.ehAdmin ? 'Todas as Solicitações' : 'Minhas Solicitações' }}
      </a>
      <a routerLink="/registrar" routerLinkActive="ativo">➕ Nova Ocorrência</a>
      <a routerLink="/mapa" routerLinkActive="ativo">🗺️ Mapa de Ocorrências</a>
      <a routerLink="/relatorios" routerLinkActive="ativo">📊 Relatórios</a>
      @if (auth.ehAdmin) {
        <a routerLink="/usuarios" routerLinkActive="ativo">👥 Usuários</a>
      }
    </nav>

    <button class="sair" type="button" (click)="sair()">↪ Sair</button>
  </aside>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
